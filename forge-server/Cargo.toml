[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cuda"]
# `cuda` enables FlashAttention v2 for the prefill path (multi_head_attention);
# decode uses paged attention and is unaffected. FA2 is a big prefill speedup
# (the naive fallback materialises the full [seq, seq] scores).
cuda = ["dep:forge-backend-cuda", "forge-backend-cuda/flash-attn"]

[dependencies]
forge-core.workspace = true
forge-runtime.workspace = true
forge-loader.workspace = true
forge-transformer.workspace = true
forge-backend-cuda = { workspace = true, optional = true }
forge-backend-cpu.workspace = true
forge-scheduler.workspace = true
forge-kvcache.workspace = true
forge-transport.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio-stream.workspace = true
minijinja = { version = "2.12", features = ["loader"] }
minijinja-contrib = { version = "2.12", features = ["pycompat"] }
tokenizers = "0.21"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[example]]
name = "dump_logits"
required-features = ["cuda"]

[[example]]
name = "graph_decode_spike"
required-features = ["cuda"]
